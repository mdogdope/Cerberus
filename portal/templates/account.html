<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/static/res/CerberusSmall.png">
	<link rel="stylesheet" href="/static/style.css" />
	<title>Cerberus | Account</title>
	<style>
		.input.error {
			border: 1px solid #E5484D;
			box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.18);
		}
		
		.accountGrid {
			display: grid;
			grid-template-columns: 1fr;
			gap: 16px;
		}
		
		.nameRow {
			display: flex;
			gap: 10px;
			align-items: center;
		}
		
		.nameRow .input {
			flex: 1;
		}
		
		.nameRow .btnSecondary {
			margin: 0;
			white-space: nowrap;
			padding: 12px 18px;
		}
		
		.sectionLead {
			margin-top: 6px;
			margin-bottom: 14px;
		}
		
		@media (max-width: 640px) {
			.nameRow {
				flex-direction: column;
				align-items: stretch;
			}
			
			.nameRow .btnSecondary {
				width: 100%;
			}
		}
		
		.input.error {
			border: 1px solid #E5484D;
			box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.18);
		}
		
	</style>
</head>
<body>
	<main class="shell shell--top">
		<div class="topbar">
			<a class="brandMini brandMini--flush" href="/">
				<img src="/static/res/Cerberus.png" alt="Cerberus logo" class="brandMini__logo" />
				<div>
					<h1 class="brandMini__title">Cerberus Portal</h1>
					<p class="brandMini__subtitle">Account</p>
				</div>
			</a>
			
			<div class="userMenu" aria-label="User menu">
				<div class="userMenu__toggle">{{ display_name }}</div>
				<div class="userMenu__panel">
					<a class="userMenu__item" href="/dashboard">Dashboard</a>
					<a class="userMenu__item" href="/settings">Settings</a>
					<a class="userMenu__item" href="/register">Add New Parent Login</a>
					<form method="post" action="/auth/logout">
						<button class="btnSecondary userMenu__logout" type="submit">Logout</button>
					</form>
				</div>
			</div>
		</div>
		
		<div class="accountGrid">
			<section class="card">
				<h2 class="sectionTitle">Display Name</h2>
				<p class="muted sectionLead">Update the name shown in the portal.</p>
				
				<form class="form" method="post" action="/api/account" data-form-type="display_name" data-confirm-message="Display name saved">
					<input type="hidden" name="form_type" value="display_name" />
					<div class="nameRow">
						<input
							class="input"
							id="display_name"
							name="display_name"
							type="text"
							autocomplete="name"
							value="{{ display_name }}"
							required
						/>
						<button class="btnSecondary" type="submit" disabled>Save</button>
					</div>
					<p class="confirmMessage" role="status" aria-live="polite"></p>
				</form>
			</section>
			
			<section class="card">
				<h2 class="sectionTitle">Password</h2>
				<p class="muted sectionLead">Use your current password, then enter a new one twice.</p>
				
				<form class="form" method="post" action="/api/account" autocomplete="off" id="passwordForm" data-form-type="password" data-confirm-message="Password saved">
					<input type="hidden" name="form_type" value="password" />
					
					<div class="field">
						<label class="label" for="old_password">Current Password</label>
						<input class="input {% if error %}error{% endif %}" id="old_password" name="old_password" type="password" autocomplete="current-password" required />
						{% if error %}{% endif %}
					</div>
					
					<div class="field">
						<label class="label" for="new_password">New Password</label>
						<input class="input" id="new_password" name="new_password" type="password" autocomplete="new-password" required />
					</div>
					
					<div class="field">
						<label class="label" for="confirm_new_password">Confirm New Password</label>
						<input class="input" id="confirm_new_password" name="confirm_new_password" type="password" autocomplete="new-password" required />
					</div>
					
					<button class="btn" type="submit" disabled>Save Password</button>
					<p class="confirmMessage" role="status" aria-live="polite"></p>
					
					{% if error %}
						<p class="error">Incorrect current password.</p>
					{% endif %}
				</form>
			</section>
		</div>
	</main>
	
	<script>
		(() => {
			const SAVED_FORM_KEY = "cerberus-saved-form";
			const SHOW_DURATION = 3200;

			function showConfirm(form) {
				const confirmEl = form.querySelector(".confirmMessage");
				if (!confirmEl) {
					return;
				}
				confirmEl.textContent = form.dataset.confirmMessage || "Saved";
				confirmEl.classList.add("is-visible");
				setTimeout(() => {
					confirmEl.classList.remove("is-visible");
				}, SHOW_DURATION);
			}

			function registerForm(form, shouldEnable) {
				const button = form.querySelector("button[type='submit']");
				if (!button) {
					return () => {};
				}
				const updateButton = () => {
					const enabled = Boolean(shouldEnable());
					button.disabled = !enabled;
					button.classList.toggle("is-active", enabled);
				};
				updateButton();
				form.addEventListener("submit", () => {
					button.disabled = true;
					button.classList.remove("is-active");
					const formType = form.dataset.formType;
					if (formType) {
						sessionStorage.setItem(SAVED_FORM_KEY, formType);
					}
				});
				return updateButton;
			}

			function showSavedMessageForForms() {
				document.querySelectorAll("form[data-form-type]").forEach((form) => {
					if (sessionStorage.getItem(SAVED_FORM_KEY) === form.dataset.formType) {
						sessionStorage.removeItem(SAVED_FORM_KEY);
						showConfirm(form);
					}
				});
			}

			const displayForm = document.querySelector("form[data-form-type='display_name']");
			if (displayForm) {
				const displayInput = displayForm.querySelector("#display_name");
				const initialValue = displayInput?.value ?? "";
				const updateDisplayButton = registerForm(displayForm, () => displayInput && displayInput.value !== initialValue);
				displayInput?.addEventListener("input", updateDisplayButton);
			}

			const passwordForm = document.getElementById("passwordForm");
			if (passwordForm) {
				const passwordSubmit = passwordForm.querySelector("button[type='submit']");
				const passwordInputs = Array.from(passwordForm.querySelectorAll("input[type='password']"));
				const newPassword = document.getElementById("new_password");
				const confirmNewPassword = document.getElementById("confirm_new_password");
				let debounceTimer = null;
				const DELAY = 400;

				const applyError = () => confirmNewPassword?.classList.add("error");
				const removeError = () => confirmNewPassword?.classList.remove("error");

				const handleInput = () => {
					if (!newPassword || !confirmNewPassword) {
						return;
					}
					const p = newPassword.value;
					const c = confirmNewPassword.value;
					if (p === c && c.length > 0) {
						clearTimeout(debounceTimer);
						removeError();
						return;
					}
					clearTimeout(debounceTimer);
					debounceTimer = setTimeout(() => {
						if (
							newPassword &&
							confirmNewPassword &&
							newPassword.value !== confirmNewPassword.value &&
							confirmNewPassword.value.length > 0
						) {
							applyError();
						}
					}, DELAY);
				};

				const updatePasswordButton = () => {
					const hasInput = passwordInputs.some((input) => input.value.length > 0);
					if (!passwordSubmit) {
						return;
					}
					passwordSubmit.disabled = !hasInput;
					passwordSubmit.classList.toggle("is-active", hasInput);
				};

				passwordInputs.forEach((input) => {
					input.addEventListener("input", () => {
						handleInput();
						updatePasswordButton();
					});
				});
				updatePasswordButton();

				passwordForm.addEventListener("submit", (e) => {
					clearTimeout(debounceTimer);
					if (!newPassword || !confirmNewPassword || newPassword.value !== confirmNewPassword.value) {
						applyError();
						e.preventDefault();
						return;
					}
					if (passwordSubmit) {
						passwordSubmit.disabled = true;
						passwordSubmit.classList.remove("is-active");
					}
					const type = passwordForm.dataset.formType;
					if (type) {
						sessionStorage.setItem(SAVED_FORM_KEY, type);
					}
				});
			}

			showSavedMessageForForms();
		})();
	</script>
</body>
</html>
