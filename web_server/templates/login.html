<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/static/res/CerberusSmall.png">
	<link rel="stylesheet" href="/static/style.css" />
	<title>Cerberus | Login</title>
</head>
<body>
	<main class="shell">
		
		<section class="panel">
			
			<div class="card">
				
				<div class="brandMini">
					<img src="/static/res/Cerberus.png" alt="Cerberus logo" class="brandMini__logo" />
					<div>
						<h1 class="brandMini__title">Cerberus Portal</h1>
						<p class="brandMini__subtitle">Parent Access</p>
					</div>
				</div>
				
				<form class="form" method="post" action="/auth/login">
					
					<div class="field">
						<label class="label" for="username">Username</label>
						<input
							class="input"
							id="username"
							name="username"
							type="username"
							required
							autocomplete="username"
						/>
					</div>
					
					<div class="field">
						<label class="label" for="password">Password</label>
						<input
							class="input"
							id="password"
							name="password"
							type="password"
							required
							autocomplete="current-password"
						/>
					</div>
					
					<button class="btn" type="submit">
						Login
					</button>
					
					{% if error %}
						<p class="error">Invalid username or password.</p>
					{% endif %}
					
				</form>
				
			</div>
			
			<div class="brandSecondary">
				<img src="/static/res/Cerberus.png" alt="Cerberus shield" />
			</div>
			
		</section>
		
	</main>
</body>
</html>
